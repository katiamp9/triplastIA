<svg
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
>
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Glow effect -->
  <circle cx="100" cy="100" r="95" fill="url(#glowGradient)" />

  <!-- Main circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" />

  <!-- Microplastic particles representation -->
  <!-- Central molecule/particle -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="#f5f5f5" stroke-width="2" opacity="0.8" />

  <!-- Orbiting particles -->
  <circle cx="100" cy="60" r="6" fill="#f5f5f5" />
  <circle cx="140" cy="100" r="6" fill="#f5f5f5" />
  <circle cx="100" cy="140" r="6" fill="#f5f5f5" />
  <circle cx="60" cy="100" r="6" fill="#f5f5f5" />

  <!-- Connecting lines -->
  <line
    x1="100"
    y1="100"
    x2="100"
    y2="60"
    stroke="#f5f5f5"
    stroke-width="1.5"
    opacity="0.6"
  />
  <line
    x1="100"
    y1="100"
    x2="140"
    y2="100"
    stroke="#f5f5f5"
    stroke-width="1.5"
    opacity="0.6"
  />
  <line
    x1="100"
    y1="100"
    x2="100"
    y2="140"
    stroke="#f5f5f5"
    stroke-width="1.5"
    opacity="0.6"
  />
  <line
    x1="100"
    y1="100"
    x2="60"
    y2="100"
    stroke="#f5f5f5"
    stroke-width="1.5"
    opacity="0.6"
  />

  <!-- Corner accent particles -->
  <circle cx="70" cy="70" r="3" fill="#00bcd4" opacity="0.7" />
  <circle cx="130" cy="70" r="3" fill="#00bcd4" opacity="0.7" />
  <circle cx="130" cy="130" r="3" fill="#00bcd4" opacity="0.7" />
  <circle cx="70" cy="130" r="3" fill="#00bcd4" opacity="0.7" />
</svg>
