<div class="login-root">
  <div class="login-card">
    <img src="/assets/images/logofinal.png" alt="TriplastIA logo" class="login-logo" />
    <h1 class="login-title">TriplastIA</h1>

    <form (ngSubmit)="onSubmit()" class="login-form" autocomplete="on">
      <div *ngIf="isInvalid" class="login-error">{{ errorMessage }}</div>
      <label class="field">
        <span class="visually-hidden">Usuario</span>
        <input name="username" [(ngModel)]="username" required placeholder="Usuario" />
      </label>

      <label class="field">
        <span class="visually-hidden">Contraseña</span>
        <div class="password-field">
          <input name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" required placeholder="Contraseña" />
          <button type="button" class="toggle-pass" (click)="toggleShowPassword()" [attr.aria-pressed]="showPassword">
            <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
            <span class="visually-hidden">Mostrar contraseña</span>
          </button>
        </div>
      </label>

      <button class="login-btn" type="submit" [disabled]="isSubmitting || !username || !password">
        <span *ngIf="!isSubmitting">Entrar</span>
        <span *ngIf="isSubmitting">Ingresando...</span>
      </button>
    </form>
  </div>
</div>
